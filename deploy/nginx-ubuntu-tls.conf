# =============================================================================
#  Cyan · Studio —— 【裸机 Ubuntu 专用】HTTPS 配置
#
#  放置位置：/etc/nginx/conf.d/portfolio.conf   （直接替换 HTTP 版，不要两份共存）
#  生效命令：nginx -t && systemctl reload nginx
#
#  与 deploy/nginx-tls.conf.example（Docker 版）的关键差异：
#    · Docker 版 upstream 指向 127.0.0.1:8081（compose 的 web 容器），裸机后端是 8080
#    · Docker 版把静态资源也 proxy_pass 了；裸机前端在 /opt/portfolio/web，
#      由本机 nginx root 直出，更快也更简单
#    · 补回了 /media/ alias、限流、SPA 回退 —— 与裸机 HTTP 版 nginx.conf 保持一致
#
#  使用前先把 __DOMAIN__ / __WWW_DOMAIN__ 换成真实域名，推荐用 certbot 自动替换：
#    sudo certbot --nginx -d 你的域名 -d www.你的域名
#  若手工部署，执行：
#    sudo sed -i "s|__DOMAIN__|example.com|g; s|__WWW_DOMAIN__|www.example.com|g" \
#         /etc/nginx/conf.d/portfolio.conf
# =============================================================================

# ---------------------- 边缘限流（防暴力破解 / 防刷接口）----------------------
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ---------------------------- HTTP：全量跳转 HTTPS ----------------------------
server {
    listen       80;
    server_name  __DOMAIN__ __WWW_DOMAIN__;

    # 让 certbot 的 HTTP-01 校验能走通（--nginx 模式会自动插入这段，手工部署保留即可）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    http2        on;
    server_name  __WWW_DOMAIN__ __DOMAIN__;

    root /opt/portfolio/web;
    index index.html;

    # ---------------------------- TLS ----------------------------
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------------------------- 基础加固 ----------------------------
    server_tokens off;
    autoindex off;
    client_max_body_size 220m;          # 与后端 max-request-size 对齐
    client_body_timeout   60s;
    send_timeout          60s;
    limit_conn conn_limit 60;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # ---------------------------- 安全响应头 ----------------------------
    # 注意：某个 location 里一旦再出现 add_header，就会覆盖上一层，
    #       所以每个 location 都按需重复关键头。
    add_header X-Content-Type-Options    nosniff                          always;
    add_header X-Frame-Options           SAMEORIGIN                       always;
    add_header Referrer-Policy           strict-origin-when-cross-origin  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    # 先小 max-age 试跑，确认站内资源都能走 HTTPS 后再调到 31536000
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # ---------------------------- 压缩 ----------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------------------------- 带指纹的静态资源：长缓存 ----------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 上传素材：Nginx 直出，不经过 Java ----------------------------
    # 后端 StorageService 落盘到 /var/lib/portfolio/upload/yyyy/MM/uuid.ext，
    # 浏览器侧拼成 /media/yyyy/MM/uuid.ext，所以这里 alias 到同一目录。
    location ^~ /media/ {
        # 防盗链：只允许「无 Referer」和本站点来源，拦外站直接嵌你的素材。
        # 必须留 none，否则直接敲地址访问的人会打不开。
        # 这只是抬门槛，防不住真想下载的人 —— 详见 deploy/nginx.conf 里的说明。
        valid_referers none blocked server_names;
        if ($invalid_referer) { return 403; }

        alias /var/lib/portfolio/upload/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # 兼容历史路径：早期内容里若存了 /uploads/xxx，也能正常打开
    location ^~ /uploads/ {
        alias /var/lib/portfolio/upload/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # ---------------------------- 登录接口：单独强限流 ----------------------------
    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 其余 API ----------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;   # 上传大视频需要
        proxy_send_timeout    120s;
        proxy_buffering       off;    # 上传 / 流式更稳
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 健康检查：不对公网暴露细节 ----------------------------
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
        add_header Cache-Control "no-store";
    }

    # ---------------------------- SPA 回退 ----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
