# =============================================================================
#  Cyan · Studio —— CentOS 裸机 Nginx 配置
#
#  放置位置：/etc/nginx/conf.d/portfolio.conf
#  生效命令：nginx -t && systemctl reload nginx
#
#  本文件由仓库里的 web/nginx.conf（Docker 版）改造而来，三处关键差异：
#    1. 上游写死 127.0.0.1:8080 —— 裸机没有 Docker 内嵌 DNS，不需要 resolver / set 变量
#    2. 静态根目录改为 /opt/portfolio/web（前端 dist 解压位置）
#    3. /media/ 直接 alias 到后端真实写入目录 /var/lib/portfolio/upload
#       后端 WebConfig 把 /media/** 映射到 APP_UPLOAD_DIR，二者必须一致，否则素材 404
#
#  重要：CentOS 的 /etc/nginx/nginx.conf 里已有一个监听 80 的默认 server，
#        会与本文件冲突（conflicting server name "_"）。
#        部署前请先注释掉 nginx.conf 里的默认 server 块，或删掉 conf.d/default.conf。
# =============================================================================

# ---------------------- 边缘限流（防暴力破解 / 防刷接口）----------------------
# 登录：每分钟 12 次，突发 5 次
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=12r/m;
# 其余 API：每秒 30 次，突发 40 次
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen       80;
    # 换成你自己的域名。写具体域名而不是 "_" 有两个原因：
    #   1. certbot --nginx 靠 server_name 匹配要签证书的 server 块，写 "_" 它匹配不到
    #   2. 备案未下来之前，把服务器公网 IP 也列进来，IP 直连照样能访问
    server_name  cyaniam.online www.cyaniam.online 8.138.93.141;

    root /opt/portfolio/web;
    index index.html;

    # ---------------------------- 基础加固 ----------------------------
    server_tokens off;
    autoindex off;
    client_max_body_size 220m;          # 与后端 max-request-size 对齐
    client_body_timeout   60s;
    send_timeout          60s;
    limit_conn conn_limit 60;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # ---------------------------- 安全响应头 ----------------------------
    # 注意：某个 location 里一旦再出现 add_header，就会覆盖上一层，
    #       所以每个 location 都按需重复关键头。
    add_header X-Content-Type-Options    nosniff                          always;
    add_header X-Frame-Options           SAMEORIGIN                       always;
    add_header Referrer-Policy           strict-origin-when-cross-origin  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    # 真正启用 HTTPS 之后再打开 HSTS（见 deploy/nginx-tls.conf.example）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------------------- 压缩 ----------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------------------------- 带指纹的静态资源：长缓存 ----------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 上传素材：Nginx 直出，不经过 Java ----------------------------
    # 后端 StorageService 落盘到 /var/lib/portfolio/upload/yyyy/MM/uuid.ext，
    # 浏览器侧拼成 /media/yyyy/MM/uuid.ext，所以这里 alias 到同一目录。
    # 坑：try_files 会把「权限不足」也吞成 404。素材报 404 时第一步先查
    #   tail /var/log/nginx/error.log   ->  stat() ... failed (13: Permission denied)
    # 有就 chmod 755 /var/lib/portfolio —— 注意是父目录，不是 upload 本身
    location ^~ /media/ {
        # 防盗链：只允许「没有 Referer」和「来自本站点」的请求。
        # ---------------------------------------------------------------------
        # 拦的是外站把你的图/视频直接嵌进他们的页面 —— 流量算你的、好处算他的。
        # 必须留 none：浏览器直接敲地址、某些隐私插件会不带 Referer，
        # 一并拦掉会让这些正常访客打不开素材。
        #
        # ⚠️ 别把它当成防盗。浏览器能播放视频就说明它已经拿到了完整数据，
        #    会开 F12 的人几秒钟就能把原文件存走 —— 前端代码写得再多也改变不了这一点。
        #    真要保版权，靠的是画面水印、法律条款，以及「只放低清预览、原片不外露」。
        #    这里做的只是把最省力的那几条路（右键另存 / 长按保存 / 拖拽 / 外站盗链）堵上。
        valid_referers none blocked server_names;
        if ($invalid_referer) { return 403; }

        alias /var/lib/portfolio/upload/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # 兼容历史路径：早期内容里若存了 /uploads/xxx，也能正常打开
    location ^~ /uploads/ {
        alias /var/lib/portfolio/upload/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # ---------------------------- 登录接口：单独强限流 ----------------------------
    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 其余 API ----------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;   # 上传大视频需要
        proxy_send_timeout    120s;
        proxy_buffering       off;    # 上传 / 流式更稳
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 健康检查：不对公网暴露细节 ----------------------------
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
        add_header Cache-Control "no-store";
    }

    # ---------------------------- SPA 回退 ----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
