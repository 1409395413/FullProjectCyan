# =============================================================================
#  Redis 生产配置 —— 【裸机 Ubuntu 专用】
#
#  与 deploy/redis.conf（Docker 版）的差异，这三条是裸机能否跑起来的关键：
#    1. dir 改为 /var/lib/redis      —— Docker 版是 /data，裸机上不存在会启动失败
#    2. 含 requirepass 占位符        —— Docker 版靠命令行注入，裸机没有这一步
#    3. 补 daemonize / supervised / pidfile / logfile
#       —— Ubuntu 的 redis.service 是 Type=notify，缺 supervised systemd 会启动超时
#
#  安装方式（由 setup-ubuntu.sh --apply-secrets 自动完成，无需手工执行）：
#    cp redis-ubuntu.conf /etc/redis/redis.conf
#    sed -i "s|__REDIS_PASSWORD__|<portfolio.env 里的值>|" /etc/redis/redis.conf
#    systemctl restart redis-server
#
#  __REDIS_PASSWORD__ 是占位符，真实密码只存在于 /opt/portfolio/deploy/portfolio.env
#  =============================================================================

# ---------------------------- 网络 ----------------------------
# 只监听本机：Redis 绝不对外暴露，安全组也不要放行 6379
# 坑：不要写成 `bind 127.0.0.1 -::1`。`-::1` 是「可选 IPv6」，
# 但 Redis 6.0（Ubuntu 22.04 自带）在没有 IPv6 的机器上不会降级跳过，
# 而是直接报错退出：Could not create server TCP listening socket -::1:6379
# 表现为 redis-server 反复重启失败、--apply-secrets 卡在这一步。
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------------------------- 进程（Ubuntu systemd 必需）----------------------------
daemonize no
supervised systemd
pidfile /run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log

# ---------------------------- 持久化 ----------------------------
# AOF 为主：崩溃最多丢 1 秒写入；RDB 作为额外快照
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
# 裸机路径：Ubuntu 的 redis-server 以 redis 用户运行，该目录属主必须是 redis
dir /var/lib/redis
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# ---------------------------- 容量 ----------------------------
# 2G 内存的机器建议下调到 256mb，4G 及以上保持 512mb
maxmemory 512mb
# 内容 key 绝不能被淘汰，否则整站内容消失
maxmemory-policy noeviction

# ---------------------------- 认证 ----------------------------
# 占位符会被 setup-ubuntu.sh --apply-secrets 替换成 portfolio.env 里的真实值。
# 千万不要在这里手写明文密码并提交到仓库。
requirepass __REDIS_PASSWORD__

# ---------------------------- 高危命令：禁用或改名 ----------------------------
rename-command FLUSHALL     ""
rename-command FLUSHDB      ""
rename-command SHUTDOWN     ""
rename-command DEBUG        ""
rename-command SAVE         ""
rename-command BGSAVE       "BG_SAVE_PRIVATE_9a2e"
rename-command CONFIG       "CONFIG_PRIVATE_4c81"
rename-command KEYS         "KEYS_PRIVATE_7d30"
rename-command SCRIPT       ""
rename-command EVAL         ""
rename-command REPLICAOF    ""
rename-command SLAVEOF      ""

# ---------------------------- 杂项 ----------------------------
databases 4
slowlog-log-slower-than 10000
slowlog-max-len 128
hash-max-ziplist-entries 512
list-max-ziplist-size -2
activerehashing yes
