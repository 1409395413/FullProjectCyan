# =============================================================================
#  生产站点 Nginx 配置（由 web/Dockerfile 拷入 /etc/nginx/conf.d/default.conf）
#  该文件的 include 位置在 http {} 内，所以 limit_req_zone 可以直接写。
#
#  职责：
#    1. 发布 dist 静态站点（SPA 回退）
#    2. /api/  反向代理到 Java 容器
#    3. /media/ 直接读取上传卷（支持视频 Range 拖拽，不经过 Java）
#
#  注意：媒体目录由 docker-compose 把 upload-data 卷挂到 /var/www/media（只读）。
#        后端写的真实目录是 /var/lib/portfolio/upload，两者是同一个卷。
# =============================================================================

# ---------------------------- 边缘限流（防暴力破解 / 防刷接口）----------------------------
# 登录：每分钟 12 次，突发 5 次
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=12r/m;
# 其余 API：每秒 30 次，突发 40 次
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS：用变量做上游，后端容器重启/晚启动也不会让 nginx 起不来
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream "api:8080";

    # ---------------------------- 基础加固 ----------------------------
    server_tokens off;
    autoindex off;
    client_max_body_size 220m;          # 与后端 max-request-size 对齐
    client_body_timeout   60s;
    send_timeout          60s;
    limit_conn conn_limit 60;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

    # ---------------------------- 安全响应头 ----------------------------
    # 只要下面某个 location 里再出现 add_header，就会覆盖上一层，所以每个
    # location 都按需重复关键头。
    add_header X-Content-Type-Options    nosniff                          always;
    add_header X-Frame-Options           SAMEORIGIN                       always;
    add_header Referrer-Policy           strict-origin-when-cross-origin  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    # HSTS 只在真正跑 HTTPS 时开启（见 deploy/nginx-tls.conf.example）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------------------------- 压缩 ----------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ---------------------------- 带指纹的静态资源：长缓存 ----------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 上传素材：直接读卷 ----------------------------
    # 后端把文件写到 /var/lib/portfolio/upload，这里挂的是同一个卷的只读副本。
    location ^~ /media/ {
        # 防盗链：只允许「无 Referer」和本站点来源，拦外站直接嵌你的素材。
        # 留 none 是必须的，否则直接敲地址访问的人会打不开。
        # 注意这只是抬门槛，防不住真想下载的人 —— 详见 deploy/nginx.conf 里的说明。
        valid_referers none blocked server_names;
        if ($invalid_referer) { return 403; }

        root /var/www;               # /media/2026/10/x.png → /var/www/media/2026/10/x.png
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # 兼容历史路径：早期内容里若存了 /uploads/xxx，也能正常打开
    location ^~ /uploads/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # ---------------------------- 登录接口：单独强限流 ----------------------------
    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 其余 API ----------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;   # 上传大视频需要
        proxy_send_timeout    120s;
        proxy_buffering       off;    # 上传/流式更稳
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------- 健康检查不对公网开放细节 ----------------------------
    location = /actuator/health {
        proxy_pass http://$api_upstream;
        access_log off;
        add_header Cache-Control "no-store";
    }

    # ---------------------------- SPA 回退 ----------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
