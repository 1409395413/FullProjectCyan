<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>功能开发中 · Cyan · Studio</title>
<!--
  预置页面 01：功能开发中
  ------------------------------------------------------------------
  后台「站点信息 → 页脚分栏 → 链接」里可以直接选中这一页，
  用来给还没做好的入口占位 —— 与其给一个死链，不如点开有句话。

  放在 web/public/pages/ 下，vite build 时原样拷进 dist/pages/，
  由 Nginx 直出（不经过前端路由），所以改这个文件必须重新构建部署。
-->
<style>
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --ink-3: #86868b;
    --accent: #2997ff;
    --card: rgba(255, 255, 255, .72);
    --border: rgba(0, 0, 0, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0e;
      --ink: #f5f5f7;
      --ink-3: #98989d;
      --accent: #6cb8ff;
      --card: rgba(255, 255, 255, .06);
      --border: rgba(255, 255, 255, .12);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 32px 24px;
    background:
      radial-gradient(1100px 620px at 50% -10%, rgba(41, 151, 255, .16), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(680px, 100%);
    padding: 46px 40px 38px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--card);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .14);
    text-align: center;
  }
  .mark {
    display: inline-grid;
    place-items: center;
    width: 52px; height: 52px;
    margin-bottom: 22px;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--accent), #7af);
    color: #fff;
    font-size: 21px;
    font-weight: 700;
    box-shadow: 0 10px 26px rgba(41, 151, 255, .38);
  }
  .eyebrow {
    margin: 0 0 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .typed {
    min-height: 2.4em;
    margin: 0;
    font-size: clamp(24px, 4.6vw, 38px);
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.35;
  }
  /* 打字机的光标：一直闪，看起来像还在输入 */
  .typed::after {
    content: '';
    display: inline-block;
    width: 3px;
    height: 1.02em;
    margin-left: 4px;
    vertical-align: -.16em;
    background: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  .typed.is-done::after { animation-duration: 1.1s; }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  .sub {
    margin: 16px 0 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-3);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .sub.is-in { opacity: 1; transform: none; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 30px;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(127, 127, 127, .1);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: transform .25s cubic-bezier(.2, .9, .3, 1.2), background .25s;
  }
  .back:hover { transform: translateY(-2px); background: rgba(127, 127, 127, .2); }
</style>
</head>
<body>
  <div class="card">
    <span class="mark" aria-hidden="true">C</span>
    <p class="eyebrow">Cyan · Studio</p>
    <p class="typed" id="typed" data-text="功能开发中，请耐心等待！"></p>
    <p class="sub" id="sub">这个入口的内容还没做好，先留个位置。<br />已经记在小本本上了，做好就换掉这个页面。</p>
    <a class="back" href="/">← 返回首页</a>
  </div>

<script>
  (function () {
    var el = document.getElementById('typed');
    var sub = document.getElementById('sub');
    var text = el.dataset.text || '';
    var i = 0;
    function tick() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i++);
        setTimeout(tick, 115);
      } else {
        el.classList.add('is-done');
        setTimeout(function () { sub.classList.add('is-in'); }, 260);
      }
    }
    setTimeout(tick, 420);
  })();
</script>
</body>
</html>
