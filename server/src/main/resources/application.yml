server:
  port: 8080
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: portfolio-server
  # ====================== MySQL 8 · 主存储 ======================
  # 正文内容 / 管理员 / 素材元数据 / 审计日志 —— 强持久化，可备份可回滚
  datasource:
    # 默认端口已改为 3306（MySQL 标准端口，也是 docker-compose 与裸机部署实际使用的端口）。
    # 历史版本这里兜底 3307，导致生产环境一旦漏配 MYSQL_PORT 就连不上库。
    # 若本地 MySQL 确实跑在 3307，请用环境变量覆盖，不要改回默认值。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:CyanWorks}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:Cyan}
    # 不提供任何默认密码：本仓库公开，硬编码凭据会随代码泄露。
    # 必须显式注入 MYSQL_PASSWORD（本地用 .env，生产用环境变量/密钥管理），
    # 缺失时启动即失败并明确报错，避免悄悄连上不可控的实例。
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: portfolio-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      # 开发用 update；生产必须改为 validate，配合 db/schema.sql 或 Flyway 迁移
      ddl-auto: ${JPA_DDL:update}
    properties:
      hibernate.jdbc.batch_size: 20
      hibernate.jdbc.time_zone: Asia/Shanghai

  # ============================ Redis ============================
  # 缓存 / 登录失败锁定 / 接口限流 / 会话黑名单 —— 缓存丢了不影响数据
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 同 MySQL：不内置默认密码，由 REDIS_PASSWORD 显式注入
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      connect-timeout: 3s
      timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  # =======================  multipart / upload ===================
  servlet:
    multipart:
      enabled: true
      # 单文件 600MB；整包略大一点，留给 multipart 边界和多个文件的开销
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:600MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:700MB}
      # 超过 2MB 就落磁盘临时文件而不是堆内存 —— 这条别调大，
      # 它是 1GB 视频不会把 512MB 的堆撑爆的关键
      file-size-threshold: 2MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false

management:
  endpoints:
    web:
      exposure:
        # 只放 health；其余端点一律不暴露，nginx 层再封一道
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # 默认关。原因：Windows 便携版 Redis 的 INFO 里带有 C:\... 这类反斜杠路径，
      # Spring 用 java.util.Properties 解析时会抛 "Malformed \uxxxx encoding"，
      # 于是 health 误报 DOWN（Redis 本身是好的）。Redis 只是缓存层，挂了会自动降级为
      # 本地缓存，真实可用性看后台「运行状态」里的 redis 字段。
      # Linux / Docker 下路径是正斜杠，可在环境变量里设 MANAGEMENT_HEALTH_REDIS_ENABLED=true。
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

logging:
  level:
    root: INFO
    com.yuchen: DEBUG
    org.springframework.data.redis: WARN

# ====================== application config ======================
app:
  key-prefix: ${APP_KEY_PREFIX:Cyan:}
  # true = 走 Redis 做内容缓存；false = 完全不用 Redis，只靠 MySQL
  cache-enabled: ${APP_CACHE_ENABLED:true}
  cache-ttl-seconds: ${APP_CACHE_TTL:300}
  # 静态资源根目录（上传的图片/视频）
  upload-dir: ${APP_UPLOAD_DIR:./data/upload}
  # 视频首帧缓存目录。留空 = 与上传目录平级的 posters 目录
  # （upload 是 /var/lib/portfolio/upload 时，这里就是 /var/lib/portfolio/posters）
  poster-dir: ${APP_POSTER_DIR:}
  # 允许上传的 MIME 白名单
  upload-allow-mime:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
    - video/mp4
    - video/webm
  # 单文件上限（字节），默认 600MB。
  # 三处上限必须同步放宽，任何一个卡住都会让大文件上传失败：
  #   这里(app.upload-max-bytes) / spring.servlet.multipart / nginx client_max_body_size
  #
  # 为什么不定到 1GB：这台机器物理内存只有 1.6GB，还要跑 MySQL + Redis + JVM。
  # 虽然上传路径全程流式不占堆，但仍要留出余量 —— 宁可对极端文件给出一句
  # 「文件超过上限 600 MB」的明确报错，也不要让整个站点因为内存耗尽而失去响应。
  # 多文件场景不受此限制：前端会自动切成 ≤90MB 的小批。
  upload-max-bytes: ${APP_UPLOAD_MAX_BYTES:629145600}

  # 地域解析：离线库 ip2region，只取到「省」，IP 依旧只存哈希。
  # 关掉或库文件缺失时，地域统计自动降级为「未知」，不影响会话记录。
  geo:
    enabled: ${APP_GEO_ENABLED:true}
    db-path: ${APP_GEO_DB:/opt/portfolio/geo/ip2region.db}

  cors:
    # 开发环境允许 Vite 前端；生产改成正式域名，或由 Nginx 反向代理避免跨域
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

  security:
    # JWT 密钥：生产务必用 openssl rand -base64 64 生成并通过环境变量注入
    jwt-secret: ${JWT_SECRET:please-change-me-please-change-me-please-change-me-32byte-minimum}
    access-token-ttl: ${JWT_ACCESS_TTL:7200}      # 秒，默认 2 小时
    remember-ttl: ${JWT_REMEMBER_TTL:1209600}     # 秒，默认 14 天
    # 登录失败防护：同一账号+IP 连续失败 N 次锁定 M 秒
    max-failed-attempts: ${LOGIN_MAX_FAILED:5}
    lock-seconds: ${LOGIN_LOCK_SECONDS:900}
    # 接口限流（令牌桶，单位：次/分钟）
    rate-limit-login: ${RATE_LIMIT_LOGIN:10}
    rate-limit-api: ${RATE_LIMIT_API:120}

  admin:
    # 首次启动用于播种初始管理员账号，播种后请删除环境变量或留空
    bootstrap-username: ${ADMIN_USERNAME:}
    bootstrap-password: ${ADMIN_PASSWORD:}
